name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=app --cov-report=xml --cov-report=term
      # Coverage upload. Public repos can upload without a token only if the Codecov
      # org setting "Token authentication for public repositories" is turned off.
      # TODO(owner): sign in at codecov.io, then either turn that setting off or add the
      # repository secret CODECOV_TOKEN. Until then this step may fail; it does not fail CI.
      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
