name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=app --cov-report=xml --cov-report=term
      # Coverage upload. Public repos can upload without a token only if the Codecov
      # org setting "Token authentication for public repositories" is turned off.
      # TODO(owner): sign in at codecov.io, then either turn that setting off or add the
      # repository secret CODECOV_TOKEN. Until then this step may fail; it does not fail CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
